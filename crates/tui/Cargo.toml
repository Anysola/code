[package]
name = "anysola-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anysola-core.workspace = true
base64.workspace = true
url.workspace = true
sha2.workspace = true
chrono.workspace = true
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
futures-util.workspace = true
ignore.workspace = true
libc.workspace = true
nucleo-matcher = "0.3"
portable-pty = "0.9"
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "underline-color"] }
serde.workspace = true
serde_json.workspace = true
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
tokio.workspace = true
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
vt100 = "0.16"

[dev-dependencies]
anysola-testkit.workspace = true
tempfile.workspace = true
