# Its own workspace, beside the agent's (crates/*): its own lockfile and release profile, and
# crates/* builds and tests without WebKitGTK.
[workspace]

[package]
name = "anysola-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "anysola-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
anysola-core = { path = "../../crates/core" }
anysola-mcp = { path = "../../crates/mcp" }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-notification = "=2.8.0"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-window-state = "=2.5.0"
tokio = { version = "1", features = ["macros", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
# Signals to a child's whole process group (git, the login shell probe).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The user's and the machine's PATH, for an app started from the Start menu.
windows-registry = "0.6"

# Full LTO only for releases (release.yml sets it): branch builds stay quick.
[profile.release]
strip = true
