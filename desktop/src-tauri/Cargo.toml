# Its own workspace: the CLI's (crates/*) builds static musl binaries and its CI runs
# `--workspace`, neither of which can take WebKitGTK.
[workspace]

[package]
name = "anysola-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "anysola-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
anysola-core = { path = "../../crates/core" }
anysola-mcp = { path = "../../crates/mcp" }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-notification = "=2.8.0"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-window-state = "=2.5.0"
tokio = { version = "1", features = ["macros", "sync", "time"] }

# Full LTO only for releases (release.yml sets it): branch builds stay quick.
[profile.release]
strip = true
