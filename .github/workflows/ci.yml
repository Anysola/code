# CI on every push and pull request: format, lint and test the agent (crates/: core, mcp, testkit) and the desktop
# app (desktop/: the window's types and build, then its Rust side) on the two platforms the app ships for,
# Windows x64 and Linux x64. The full test suites run here, not on a developer's machine. A last job builds
# the app unbundled for Linux arm64 and keeps it as an artifact, to try a commit on an arm64 machine.
#
# Runners: the Linux x64 jobs run on Avrea (avrea.com), where the test job takes about a third of the time it
# does on GitHub's runner. Windows and arm64 stay on GitHub's own: the repository is public, so they cost
# nothing there, and on Avrea they are billed at eight to nine times the Linux rate. To go back, put
# `ubuntu-24.04` where an `avrea-ubuntu-24.04-*` label is.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a new stable's lints do not break `clippy -D warnings` on an unchanged tree.
  RUST_VERSION: "1.99.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: avrea-ubuntu-24.04-2-vcpu
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --check
        working-directory: desktop/src-tauri

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { build: linux-x64, os: avrea-ubuntu-24.04-8-vcpu-16gb }
          - { build: windows-x64, os: windows-2025 }
    name: test (${{ matrix.build }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop/src-tauri
          key: ${{ matrix.build }}
          # A cache saved under a tag is readable from that tag alone.
          save-if: ${{ github.ref_type == 'branch' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf bubblewrap
      - name: Shell sandbox (bwrap)
        # The sandbox tests run bwrap for real here: Ubuntu 24.04 restricts unprivileged user
        # namespaces by default, and ANYSOLA_REQUIRE_BWRAP makes a bwrap that can't start a failure
        # instead of a skip.
        if: runner.os == 'Linux'
        run: |
          # The knob exists only where AppArmor restricts user namespaces (GitHub's image); a runner
          # without it has nothing to lift, and ANYSOLA_REQUIRE_BWRAP still fails a bwrap that can't start.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "ANYSOLA_REQUIRE_BWRAP=1" >> "$GITHUB_ENV"

      - name: Agent (clippy)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Agent (tests)
        run: cargo test --locked --workspace --no-fail-fast

      - name: Window (install)
        working-directory: desktop
        run: npm ci
      - name: Window (types and build)
        # The Rust side embeds the built window, so it comes first.
        working-directory: desktop
        run: npm run build
      - name: Desktop (clippy and tests)
        working-directory: desktop/src-tauri
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  app:
    # A debug build of the desktop app with the window inside, not an installer: desktop.yml builds those.
    name: app (linux-arm64, debug)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: app-linux-arm64
          # A cache saved under a tag is readable from that tag alone.
          save-if: ${{ github.ref_type == 'branch' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Linux packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: App
        # Types and the window's build run first, as tauri.conf.json's beforeBuildCommand.
        run: npx tauri build --debug --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: anysola-code-app-linux-arm64-debug
          if-no-files-found: error
          retention-days: 14
          path: desktop/src-tauri/target/debug/anysola-desktop
