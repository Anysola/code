# CI on every push and pull request: format, lint, build, test and smoke-run (linux-x64 and windows-x64 on branch pushes; the six
# release platforms on tags and manual runs, native runners, no cross-compiling), plus the static musl build and the
# size/latency budgets on Linux.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a new stable's lints do not break `clippy -D warnings` on an unchanged tree.
  RUST_VERSION: "1.99.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CC_x86_64_unknown_linux_musl: musl-gcc
  CC_aarch64_unknown_linux_musl: musl-gcc

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    strategy:
      fail-fast: false
      # A branch push tests linux-x64 and windows-x64; tags and manual runs test all six platforms.
      matrix:
        include: ${{ fromJSON((startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && '[{"build":"linux-x64","os":"ubuntu-24.04","musl":"x86_64-unknown-linux-musl"},{"build":"linux-arm64","os":"ubuntu-24.04-arm","musl":"aarch64-unknown-linux-musl"},{"build":"darwin-arm64","os":"macos-15"},{"build":"darwin-x64","os":"macos-15-intel"},{"build":"windows-x64","os":"windows-2025"},{"build":"windows-arm64","os":"windows-11-arm"}]' || '[{"build":"linux-x64","os":"ubuntu-24.04","musl":"x86_64-unknown-linux-musl"},{"build":"windows-x64","os":"windows-2025"}]') }}
    name: test (${{ matrix.build }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
          targets: ${{ matrix.musl }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.build }}
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools time

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --no-fail-fast
      - name: Smoke run
        run: |
          set -euo pipefail
          bin=target/debug/anysola
          [ -f "$bin" ] || bin=target/debug/anysola.exe
          out="$("$bin" --version | tr -d '\r')"
          echo "$out"
          test "$out" = "Anysola Code $(cargo pkgid -p anysola | sed 's/.*[@#]//') (OpenCode 2.2.5)"
          "$bin" --help | grep -q "anysola <subcommand>"
          ! "$bin" --help | grep -qi "opencode command line"

      - name: Static musl build
        if: matrix.musl
        run: |
          set -euo pipefail
          cargo build --locked -p anysola --target ${{ matrix.musl }}
          bin=target/${{ matrix.musl }}/debug/anysola
          file "$bin" | tee /dev/stderr | grep -Eq "static(-pie)? linked|statically linked"
          "$bin" --version
      - name: Budgets
        if: matrix.build == 'linux-x64'
        run: script/budget.sh
