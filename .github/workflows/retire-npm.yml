# One-off: marks every version of the terminal app's npm packages as deprecated, so `npm i -g @anysola/code`
# says where the product went. Nothing is unpublished; `npm deprecate <pkg> ""` undoes it. Runs by hand only,
# and does nothing unless `confirm` is the word below. Delete this file once it has run.
name: retire-npm

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "retire" to deprecate the packages; anything else only lists them.
        required: false
        default: ""

permissions: {}

jobs:
  deprecate:
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Deprecate @anysola/code and its platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CONFIRM: ${{ inputs.confirm }}
          MESSAGE: "The Anysola Code terminal app is retired. Get the desktop app at https://www.anysola.com/code"
        run: |
          set -euo pipefail
          packages="@anysola/code"
          # The platform packages are whatever the last release depended on.
          for p in $(npm view @anysola/code optionalDependencies --json | jq -r 'keys[]'); do
            packages="$packages $p"
          done
          for p in $packages; do
            if [ "$CONFIRM" = "retire" ]; then
              npm deprecate "$p" "$MESSAGE"
              echo "deprecated $p"
            else
              echo "would deprecate $p"
            fi
          done
