# Anysola Code release: on a tag push, build the desktop app's installers for Windows (NSIS, per-user) and Linux
# (AppImage, .deb), sign them for the in-app updater, write the updater's manifest (latest-desktop.json), and
# create the GitHub release that holds those four files.
#
# Tag format: v<version>, for example v1.1.0. A manual run (workflow_dispatch) is a dry run: everything up to and
# including the four release files (kept as the `release` artifact), nothing published.
#
# Installed apps (1.0.6 and later) find an update through the version Admin marks latest and then
# releases/download/v<latest>/latest-desktop.json, so the asset names, the manifest's shape and the signing key
# must not change. Secrets: TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the updater key,
# backed up with the server's files; desktop/src-tauri/tauri.conf.json holds its public half).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only; a manual run never publishes (kept for the dispatch form)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.99.0"
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.anysola }}
    steps:
      - id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then tag="0.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "anysola=$tag" >> "$GITHUB_OUTPUT"

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { build: windows-x64, os: windows-2025, bundles: nsis }
          - { build: linux-x64, os: ubuntu-24.04, bundles: "appimage,deb" }
    name: desktop (${{ matrix.build }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build and sign
        env:
          ANYSOLA_VERSION: ${{ needs.version.outputs.version }}
          # The shipped binary is fully optimized; branch builds skip this for speed.
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles ${{ matrix.bundles }} --config "{\"version\":\"$ANYSOLA_VERSION\"}"
      - name: Name the assets
        run: |
          set -euo pipefail
          out=../dist-desktop; mkdir -p "$out"; b=src-tauri/target/release/bundle
          if [ "${{ runner.os }}" = Windows ]; then
            cp $b/nsis/*-setup.exe "$out/anysola-code-desktop-windows-x64-setup.exe"
            cp $b/nsis/*-setup.exe.sig "$out/anysola-code-desktop-windows-x64-setup.exe.sig"
          else
            cp $b/appimage/*.AppImage "$out/anysola-code-desktop-linux-x64.AppImage"
            cp $b/appimage/*.AppImage.sig "$out/anysola-code-desktop-linux-x64.AppImage.sig"
            cp $b/deb/*.deb "$out/anysola-code-desktop-linux-x64.deb"
          fi
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.build }}
          path: dist-desktop
          if-no-files-found: error

  assemble:
    # Runs on dry runs too, so the files a tag would publish can be checked first.
    needs: [version, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop
          merge-multiple: true
      - name: The updater's manifest and the release files
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd desktop
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          # Each platform's installer and its signature, as installed apps read it.
          jq -n --arg v "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg base "$base" \
            --rawfile win anysola-code-desktop-windows-x64-setup.exe.sig \
            --rawfile linux anysola-code-desktop-linux-x64.AppImage.sig \
            '{version: $v, pub_date: $date, notes: "Changes: CHANGELOG.md",
              platforms: {
                "windows-x86_64": {signature: $win, url: ($base + "/anysola-code-desktop-windows-x64-setup.exe")},
                "linux-x86_64": {signature: $linux, url: ($base + "/anysola-code-desktop-linux-x64.AppImage")}
              }}' > latest-desktop.json
          cat latest-desktop.json
          mkdir ../release
          cp anysola-code-desktop-windows-x64-setup.exe anysola-code-desktop-linux-x64.AppImage \
            anysola-code-desktop-linux-x64.deb latest-desktop.json ../release/
          cd ../release
          ls -la
          test "$(ls | sort | tr '\n' ' ')" = "anysola-code-desktop-linux-x64.AppImage anysola-code-desktop-linux-x64.deb anysola-code-desktop-windows-x64-setup.exe latest-desktop.json "
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release
          if-no-files-found: error

  github-release:
    needs: [version, assemble]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          test "$(ls release | wc -l)" -eq 4
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "v$VERSION" release/* --repo "$GITHUB_REPOSITORY" --title "Anysola Code $VERSION" \
            --notes "Download: https://www.anysola.com/code (Windows, Linux). Installed apps update themselves. Changes: CHANGELOG.md." \
            --verify-tag "${flags[@]}"
