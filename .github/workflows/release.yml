# Anysola Code release: build every platform binary on a tag push and publish the npm packages.
#
# Lives at .github/workflows/release.yml in the Anysola Code fork (branch `anysola`).
# Tag format: v<anysola version>, for example v0.2.0. The upstream OpenCode version the fork is built
# from is read from packages/cli/package.json and stays in the User-Agent the Anysola gateway allowlists.
#
# Secrets: NPM_TOKEN (npm automation token with publish rights on the @anysola scope).
# Upstream's own workflows under .github/workflows/ should be deleted or disabled in the fork; most of
# them are guarded by `github.repository == 'anomalyco/opencode'` but not all.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack only, do not publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.4"

jobs:
  build:
    # Bun cross-compiles every target from one Linux x64 runner, as upstream's build-cli job does.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.anysola }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: version
        name: Versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then tag="0.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "anysola=$tag" >> "$GITHUB_OUTPUT"
          echo "opencode=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all targets
        working-directory: packages/cli
        # The web UI is not part of Anysola Code (see README); skipping it also keeps the binaries smaller.
        run: bun run build --skip-web-ui && rm -rf dist/.bun
        env:
          ANYSOLA_VERSION: ${{ steps.version.outputs.anysola }}
          OPENCODE_VERSION: ${{ steps.version.outputs.opencode }}
          OPENCODE_CHANNEL: latest
          # Compile against the official Bun runtimes for every target (checksummed downloads).
          BUN_COMPILE_RELEASE: bun-v${{ env.BUN_VERSION }}
          GH_TOKEN: ${{ github.token }}

      - name: Smoke test (linux-x64)
        run: |
          bin=packages/cli/dist/code-linux-x64/bin/anysola
          out="$($bin --version)"
          echo "$out"
          test "$out" = "Anysola Code ${{ steps.version.outputs.anysola }} (OpenCode ${{ steps.version.outputs.opencode }})"
          $bin --help | grep -q "anysola <subcommand>"
          ! $bin --help | grep -qi "opencode command line"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/cli/dist
          if-no-files-found: error

  sign-macos:
    # Cross-compiled darwin binaries get an ad-hoc signature so Gatekeeper runs them. Replace with a
    # Developer ID signature and notarization when Anysola has an Apple developer account.
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Ad-hoc sign
        run: |
          for bin in dist/code-darwin-*/bin/anysola; do
            chmod +x "$bin"
            codesign --force --sign - "$bin"
            "$bin" --version || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-signed
          path: dist
          if-no-files-found: error

  pack:
    needs: [build, sign-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist-signed
          path: packages/cli/dist
      - name: Pack npm packages
        run: rm -f packages/cli/dist/SHA256SUMS && bun run --cwd packages/cli pack
        env:
          ANYSOLA_VERSION: ${{ needs.build.outputs.version }}
          OPENCODE_CHANNEL: latest
          OPENCODE_VERSION: "0.0.0"
      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: dist/npm/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: archives
          path: dist/archives
          if-no-files-found: ignore

  publish:
    needs: [build, pack]
    if: github.ref_type == 'tag' || inputs.dry_run == false
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          name: npm
          path: npm
      - name: Publish platform packages, then @anysola/code
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          # Platform packages first: the main package's postinstall installs one of them by exact version.
          for file in npm/anysola-code-*-"$VERSION".tgz; do
            npm publish "$file" --access public --tag "$tag"
          done
          npm publish "npm/anysola-code-$VERSION.tgz" --access public --tag "$tag"
