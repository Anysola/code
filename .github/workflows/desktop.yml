# Installers of a branch for Windows (NSIS, per-user) and Linux (AppImage, .deb), kept as workflow
# artifacts to be tried on a real machine; ci.yml runs the checks. Not code-signed yet: Windows shows
# SmartScreen's "unknown publisher" on first run.
name: desktop

on:
  push:
    # Branches only: a tag's installers are release.yml's, and a path filter does not apply to tags.
    branches: ["**"]
    paths:
      - "desktop/**"
      - "crates/core/**"
      - "crates/mcp/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.99.0"
  CARGO_TERM_COLOR: always

jobs:
  installer:
    name: installer (${{ matrix.build }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { build: windows-x64, os: windows-2025, bundles: nsis }
          - { build: linux-x64, os: ubuntu-24.04, bundles: "appimage,deb" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: desktop-${{ matrix.build }}
          # A cache saved under a tag is readable from that tag alone.
          save-if: ${{ github.ref_type == 'branch' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Installer
        env:
          # Signs the updater artifacts; the key is the one tauri.conf.json's pubkey checks.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Types and the window's build run first, as tauri.conf.json's beforeBuildCommand.
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: anysola-code-desktop-${{ matrix.build }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
