# Installers of a branch for Windows (NSIS, per-user) and Linux (AppImage, .deb), kept as workflow
# artifacts to be tried on a real machine; ci.yml runs the checks. Actions here and in release.yml are
# pinned to a commit: a moved tag would run in the job that holds the signing key. Not code-signed
# yet: Windows shows SmartScreen's "unknown publisher" on first run.
name: desktop

on:
  push:
    # Branches only: a tag's installers are release.yml's, and a path filter does not apply to tags.
    branches: ["**"]
    paths:
      - "desktop/**"
      - "crates/core/**"
      - "crates/mcp/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.99.0"
  CARGO_TERM_COLOR: always

jobs:
  installer:
    name: installer (${{ matrix.build }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { build: windows-x64, os: windows-2025, bundles: nsis }
          - { build: linux-x64, os: ubuntu-24.04, bundles: "appimage,deb" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-27
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri
          key: desktop-${{ matrix.build }}
          # A cache saved under a tag is readable from that tag alone.
          save-if: ${{ github.ref_type == 'branch' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Installer
        # Types and the window's build run first, as tauri.conf.json's beforeBuildCommand.
        # No updater artifacts: they need the signing key, which only release.yml gets, so a
        # branch push can't reach it.
        run: npx tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anysola-code-desktop-${{ matrix.build }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
