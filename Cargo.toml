[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0-dev"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
fancy-regex = "0.16"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gethostname = "1.1"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1.12", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ignore = "0.4"
libc = "0.2"
rand = "0.8"
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "http2"] }
rquickjs = { version = "0.14", default-features = false, features = ["futures", "std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time", "signal", "net"] }
tokio-util = "0.7"
url = "2.5"

anysola-core = { path = "crates/core" }
anysola-testkit = { path = "crates/testkit" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
debug = "line-tables-only"
